name: Verify model and QQ mail
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test model response and send one configuration test email
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER }}
          LLM_PRIMARY_API_KEY: ${{ secrets.LLM_PRIMARY_API_KEY }}
          LLM_PRIMARY_BASE_URL: ${{ vars.LLM_PRIMARY_BASE_URL }}
          LLM_PRIMARY_MODEL: ${{ vars.LLM_PRIMARY_MODEL }}
        run: |
          python - <<'PY'
          import json, os, smtplib, ssl
          from email.message import EmailMessage
          from urllib.request import Request, urlopen
          failures = []
          try:
              body = json.dumps({'model': os.environ['LLM_PRIMARY_MODEL'], 'input': 'Reply with OK only.', 'max_output_tokens': 64}).encode()
              request = Request(os.environ['LLM_PRIMARY_BASE_URL'].rstrip('/') + '/responses', data=body, headers={'Authorization': 'Bearer ' + os.environ['LLM_PRIMARY_API_KEY'], 'Content-Type': 'application/json', 'User-Agent': 'Quanti/1.0'})
              with urlopen(request, timeout=90) as response:
                  result = json.load(response)
              text = result.get('output_text') or ''.join(p.get('text', '') for i in result.get('output', []) for p in i.get('content', []) if p.get('type') == 'output_text')
              if not text.strip():
                  raise ValueError('no text returned')
              print('MODEL_RESPONSE_OK')
          except Exception as exc:
              print('MODEL_FAILED', type(exc).__name__, getattr(exc, 'code', ''))
              failures.append('model')
          try:
              sender = os.environ['EMAIL_SENDER']
              message = EmailMessage()
              message['Subject'] = 'Quanti 配置验证：QQ 邮箱已连接'
              message['From'] = sender
              message['To'] = sender
              message.set_content('这是你授权的量化工具配置测试邮件。QQ 邮箱密钥已安全复用到 Quanti；本邮件不包含股票买卖建议。')
              smtp = smtplib.SMTP_SSL('smtp.qq.com', 465, timeout=30, context=ssl.create_default_context())
              try:
                  smtp.login(sender, os.environ['EMAIL_PASSWORD'])
                  refused = smtp.send_message(message)
                  if refused:
                      raise RuntimeError('recipient refused')
                  print('QQ_SMTP_ACCEPTED')
              finally:
                  smtp.close()
          except Exception as exc:
              print('QQ_FAILED', type(exc).__name__, getattr(exc, 'smtp_code', ''))
              failures.append('qq')
          if failures:
              raise SystemExit('Failed: ' + ', '.join(failures))
          PY
